<script>
const REPO_OWNER = "drexvex";
const REPO_NAME = "Drex-Vex-Store";
const DATA_FILE = "store.json";

let storeData = {
  categories: ["All", "Fashion", "Shoes", "Accessories", "Home and Living", "Beauty", "Electronics", "Trending Products", "Best Deals"],
  products: [
    {
      id: "demo-1",
      name: "Midnight Noir Luxury Analog Watch",
      price: 549,
      mrp: 1499,
      category: "Accessories",
      rating: 4.8,
      normalUrl: "https://www.meesho.com",
      affiliateUrl: "",
      images: ["https://images.unsplash.com/photo-1524592094714-0f0654e20314?auto=format&fit=crop&w=600&q=80"],
      description: "Matte black stainless steel finish with scratch-resistant glass and water resistance.",
      featured: true,
      published: true,
      clicks: 0
    }
  ],
  earnings: { orders: 0, amount: 0 }
};

let activeCategory = "All";
let uploadedBase64 = [];
let wishlist = JSON.parse(localStorage.getItem("dv_wish") || "[]");
let recent = JSON.parse(localStorage.getItem("dv_recent") || "[]");
let localStats = JSON.parse(localStorage.getItem("dv_stats") || '{"views":0,"clicks":0}');

if (!sessionStorage.getItem("dv_visited")) {
  localStats.views++;
  localStorage.setItem("dv_stats", JSON.stringify(localStats));
  sessionStorage.setItem("dv_visited", "1");
}

async function init() {
  renderCategories();
  renderProducts();
  renderRecent();
  updateWishCount();
  checkSavedToken();
  try {
    const res = await fetch(DATA_FILE + "?t=" + Date.now());
    if (res.ok) {
      const remote = await res.json();
      if (remote && remote.products) {
        storeData = remote;
        renderCategories();
        renderProducts();
        renderRecent();
      }
    }
  } catch (e) {}
}

function getBuyLink(p) {
  return (p.affiliateUrl && p.affiliateUrl.trim() !== "") ? p.affiliateUrl.trim() : p.normalUrl.trim();
}

function renderCategories() {
  const bar = document.getElementById("categoryBar");
  if (!bar) return;
  bar.innerHTML = storeData.categories.map(function(c) {
    return '<button class="cat-pill ' + (c === activeCategory ? 'active' : '') + '" onclick="filterCategory(\'' + c.replace(/'/g, "\\'") + '\')">' + c + '</button>';
  }).join("");
  const sel = document.getElementById("pCat");
  if (sel) {
    sel.innerHTML = storeData.categories.filter(function(c) { return c !== "All"; }).map(function(c) {
      return '<option value="' + c + '">' + c + '</option>';
    }).join("");
  }
}

function filterCategory(cat) {
  activeCategory = cat;
  document.getElementById("gridHeading").textContent = cat === "All" ? "All Products" : cat;
  renderCategories();
  renderProducts();
}

function handleSearch(q) {
  const box = document.getElementById("searchSuggestions");
  const term = q.trim().toLowerCase();
  if (!term) { box.style.display = "none"; renderProducts(); return; }
  const matches = storeData.products.filter(function(p) { return p.published && p.name.toLowerCase().includes(term); });
  if (matches.length) {
    box.style.display = "block";
    box.innerHTML = matches.slice(0, 5).map(function(p) {
      return '<div onclick="openDetail(\'' + p.id + '\')">' + p.name + ' - Rs.' + p.price + '</div>';
    }).join("");
  } else {
    box.style.display = "none";
  }
  renderProducts();
}

function renderProducts() {
  const term = document.getElementById("searchInput").value.trim().toLowerCase();
  const sort = document.getElementById("sortSelect").value;
  let list = storeData.products.filter(function(p) { return p.published; });

  if (activeCategory !== "All") list = list.filter(function(p) { return p.category === activeCategory; });
  if (term) list = list.filter(function(p) { return p.name.toLowerCase().includes(term) || (p.description || "").toLowerCase().includes(term); });

  if (sort === "low") list.sort(function(a, b) { return a.price - b.price; });
  else if (sort === "high") list.sort(function(a, b) { return b.price - a.price; });
  else if (sort === "popular") list.sort(function(a, b) { return (b.clicks || 0) - (a.clicks || 0); });
  else list.sort(function(a, b) { return (b.featured ? 1 : 0) - (a.featured ? 1 : 0); });

  const grid = document.getElementById("productGrid");
  grid.innerHTML = list.length ? list.map(productCardHTML).join("") : '<p style="color:var(--muted); grid-column:1/-1; text-align:center; padding:30px;">No products found.</p>';
}

function productCardHTML(p) {
  const disc = p.mrp > p.price ? Math.round(((p.mrp - p.price) / p.mrp) * 100) : 0;
  const wished = wishlist.includes(p.id);
  const img = (p.images && p.images[0]) || "https://via.placeholder.com/400x400/191428/c084fc?text=Drex+Vex";
  return '<div class="card">' +
    '<div class="card-img-wrap" onclick="openDetail(\'' + p.id + '\')">' +
      (disc > 0 ? '<span class="discount-badge">' + disc + '% OFF</span>' : '') +
      '<button class="wish-btn" onclick="event.stopPropagation(); toggleWish(\'' + p.id + '\')">' + (wished ? '❤️' : '🤍') + '</button>' +
      '<img src="' + img + '" alt="' + p.name + '" loading="lazy">' +
    '</div>' +
    '<div class="card-body">' +
      '<div class="card-cat">' + p.category + '</div>' +
      '<div class="card-title" onclick="openDetail(\'' + p.id + '\')">' + p.name + '</div>' +
      '<div class="rating">★ ' + (p.rating || 4.5) + '</div>' +
      '<div class="price-row">' +
        '<span class="price">₹' + p.price + '</span>' +
        (p.mrp > p.price ? '<span class="mrp">₹' + p.mrp + '</span>' : '') +
      '</div>' +
      '<div class="card-actions">' +
        '<button class="buy-btn" onclick="buyProduct(\'' + p.id + '\')">Buy Now</button>' +
        '<button class="share-btn" onclick="shareWhatsApp(\'' + p.id + '\')">📲</button>' +
      '</div>' +
    '</div>' +
  '</div>';
}

function buyProduct(id) {
  const p = storeData.products.find(function(x) { return x.id === id; });
  if (!p) return;
  p.clicks = (p.clicks || 0) + 1;
  localStats.clicks++;
  localStorage.setItem("dv_stats", JSON.stringify(localStats));
  window.open(getBuyLink(p), "_blank", "noopener");
}

function shareWhatsApp(id) {
  const p = storeData.products.find(function(x) { return x.id === id; });
  if (!p) return;
  const text = "Check out *" + p.name + "* for just Rs." + p.price + " on Drex Vex Store!\n" + window.location.href;
  window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank");
}

function toggleWish(id) {
  wishlist = wishlist.includes(id) ? wishlist.filter(function(x) { return x !== id; }) : wishlist.concat([id]);
  localStorage.setItem("dv_wish", JSON.stringify(wishlist));
  updateWishCount();
  renderProducts();
}

function updateWishCount() {
  document.getElementById("wishCount").textContent = wishlist.length;
}

function openWishlist() {
  const items = storeData.products.filter(function(p) { return wishlist.includes(p.id); });
  const modal = document.getElementById("detailModal");
  document.getElementById("detailContent").innerHTML =
    '<div class="modal-head"><h3>Your Wishlist (' + items.length + ')</h3><button class="close-btn" onclick="closeModal(\'detailModal\')">✕</button></div>' +
    (items.length ? '<div class="grid" style="padding:0;">' + items.map(productCardHTML).join("") + '</div>' : '<p style="color:var(--muted);">No saved items yet.</p>');
  modal.classList.add("open");
}

function openDetail(id) {
  document.getElementById("searchSuggestions").style.display = "none";
  const p = storeData.products.find(function(x) { return x.id === id; });
  if (!p) return;
  recent = [id].concat(recent.filter(function(x) { return x !== id; })).slice(0, 4);
  localStorage.setItem("dv_recent", JSON.stringify(recent));
  renderRecent();

  const imgs = (p.images && p.images.length) ? p.images : ["https://via.placeholder.com/400"];
  document.getElementById("detailContent").innerHTML =
    '<div class="modal-head"><span class="card-cat">' + p.category + '</span><button class="close-btn" onclick="closeModal(\'detailModal\')">✕</button></div>' +
    '<img id="mainDetailImg" class="detail-main-img" src="' + imgs[0] + '">' +
    (imgs.length > 1 ? '<div class="thumb-row">' + imgs.map(function(src, i) { return '<img src="' + src + '" class="' + (i===0?'active':'') + '" onclick="document.getElementById(\'mainDetailImg\').src=\'' + src + '\'">'; }).join("") + '</div>' : '') +
    '<h2 style="font-size:1.25rem; margin-bottom:6px;">' + p.name + '</h2>' +
    '<div class="rating" style="margin-bottom:10px;">★ ' + (p.rating || 4.5) + ' Verified Rating</div>' +
    '<div class="price-row"><span class="price" style="font-size:1.4rem;">₹' + p.price + '</span>' + (p.mrp > p.price ? '<span class="mrp">₹' + p.mrp + '</span>' : '') + '</div>' +
    '<p style="color:var(--muted); font-size:0.9rem; line-height:1.5; margin-bottom:18px;">' + (p.description || "Premium quality curated product.") + '</p>' +
    '<div style="display:flex; gap:10px;">' +
      '<button class="btn-primary" style="flex:1; justify-content:center;" onclick="buyProduct(\'' + p.id + '\')">Buy Now on Meesho →</button>' +
      '<button class="icon-btn" onclick="shareWhatsApp(\'' + p.id + '\')">Share 📲</button>' +
    '</div>';
  document.getElementById("detailModal").classList.add("open");
}

function renderRecent() {
  const items = recent.map(function(id) { return storeData.products.find(function(p) { return p.id === id && p.published; }); }).filter(Boolean);
  const sec = document.getElementById("recentSection");
  if (items.length) {
    sec.style.display = "block";
    document.getElementById("recentGrid").innerHTML = items.map(productCardHTML).join("");
  }
}

function closeModal(id) { document.getElementById(id).classList.remove("open"); }

function openInfo(type) {
  const copy = {
    about: ["About Drex Vex Store", "Drex Vex Store curates trending fashion, electronics, and lifestyle finds from Meesho so you discover top-rated products effortlessly."],
    disclosure: ["Affiliate Disclosure", "Drex Vex Store participates in the Meesho Affiliate program. When you click Buy Now and purchase on Meesho, we may earn a small commission at zero extra cost to you."],
    privacy: ["Privacy Policy", "We respect your privacy. Wishlist and browsing history are stored locally on your device. Purchases occur securely on Meesho official platform."],
    terms: ["Terms and Conditions", "Prices and availability are subject to change on Meesho. Always verify final product specifications on the seller page before ordering."],
    contact: ["Contact Us", "For product inquiries or collaborations, reach out via our official GitHub repository: github.com/drexvex/Drex-Vex-Store"]
  };
  const info = copy[type];
  document.getElementById("infoContent").innerHTML =
    '<div class="modal-head"><h3>' + info[0] + '</h3><button class="close-btn" onclick="closeModal(\'infoModal\')">✕</button></div>' +
    '<p style="color:var(--muted); line-height:1.6; font-size:0.92rem;">' + info[1] + '</p>';
  document.getElementById("infoModal").classList.add("open");
}

function toggleAdmin() {
  document.getElementById("storeView").style.display = "none";
  document.getElementById("adminView").classList.add("active");
  renderAdmin();
}
function showStore() {
  document.getElementById("adminView").classList.remove("active");
  document.getElementById("storeView").style.display = "block";
}
function saveToken() {
  const t = document.getElementById("ghTokenInput").value.trim();
  if (!t) return alert("Please paste your GitHub token.");
  localStorage.setItem("dv_gh_token", t);
  checkSavedToken();
}
function clearToken() {
  localStorage.removeItem("dv_gh_token");
  checkSavedToken();
}
function checkSavedToken() {
  const t = localStorage.getItem("dv_gh_token");
  document.getElementById("adminControls").style.display = t ? "block" : "none";
  document.getElementById("syncStatus").textContent = t ? "✅ Connected to GitHub. Ready to publish." : "🔒 Locked. Enter token to manage products.";
}

function handleImageFiles(files) {
  uploadedBase64 = [];
  const prev = document.getElementById("uploadPreview");
  prev.innerHTML = "";
  Array.from(files).slice(0, 4).forEach(function(file) {
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement("canvas");
        const scale = Math.min(1, 700 / img.width);
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        const compressed = canvas.toDataURL("image/jpeg", 0.78);
        uploadedBase64.push(compressed);
        prev.innerHTML += '<img src="' + compressed + '" style="width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--purple-light);">';
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function saveProduct() {
  const name = document.getElementById("pName").value.trim();
  const price = Number(document.getElementById("pPrice").value);
  const normalUrl = document.getElementById("pNormalUrl").value.trim();
  if (!name || !price || !normalUrl) return alert("Product Name, Price, and Normal URL are required.");

  const editId = document.getElementById("editProductId").value;
  const existing = storeData.products.find(function(p) { return p.id === editId; });

  const productObj = {
    id: editId || "prod-" + Date.now(),
    name: name,
    price: price,
    mrp: Number(document.getElementById("pMrp").value) || price,
    category: document.getElementById("pCat").value,
    rating: Number(document.getElementById("pRating").value) || 4.5,
    normalUrl: normalUrl,
    affiliateUrl: document.getElementById("pAffUrl").value.trim(),
    images: uploadedBase64.length ? uploadedBase64 : (existing ? existing.images : []),
    description: document.getElementById("pDesc").value.trim(),
    featured: document.getElementById("pFeatured").checked,
    published: document.getElementById("pPublished").checked,
    clicks: existing ? (existing.clicks || 0) : 0
  };

  if (editId) {
    storeData.products = storeData.products.map(function(p) { return p.id === editId ? productObj : p; });
  } else {
    storeData.products.unshift(productObj);
  }

  resetForm();
  await pushToGitHub();
}

function editProduct(id) {
  const p = storeData.products.find(function(x) { return x.id === id; });
  if (!p) return;
  document.getElementById("formTitle").textContent = "✏️ Edit Product";
  document.getElementById("editProductId").value = p.id;
  document.getElementById("pName").value = p.name;
  document.getElementById("pPrice").value = p.price;
  document.getElementById("pMrp").value = p.mrp;
  document.getElementById("pCat").value = p.category;
  document.getElementById("pRating").value = p.rating;
  document.getElementById("pNormalUrl").value = p.normalUrl;
  document.getElementById("pAffUrl").value = p.affiliateUrl || "";
  document.getElementById("pDesc").value = p.description || "";
  document.getElementById("pFeatured").checked = p.featured;
  document.getElementById("pPublished").checked = p.published;
  uploadedBase64 = [];
  window.scrollTo({ top: 0, behavior: "smooth" });
}

async function deleteProduct(id) {
  if (!confirm("Delete this product?")) return;
  storeData.products = storeData.products.filter(function(p) { return p.id !== id; });
  await pushToGitHub();
}

async function addCategory() {
  const c = document.getElementById("newCatName").value.trim();
  if (!c || storeData.categories.includes(c)) return;
  storeData.categories.push(c);
  document.getElementById("newCatName").value = "";
  await pushToGitHub();
}

async function logEarnings() {
  storeData.earnings = {
    orders: Number(document.getElementById("earnOrders").value) || 0,
    amount: Number(document.getElementById("earnAmount").value) || 0
  };
  await pushToGitHub();
}

function resetForm() {
  document.getElementById("formTitle").textContent = "➕ Add New Product";
  document.getElementById("editProductId").value = "";
  ["pName","pPrice","pMrp","pNormalUrl","pAffUrl","pDesc"].forEach(function(id) { document.getElementById(id).value = ""; });
  document.getElementById("uploadPreview").innerHTML = "";
  uploadedBase64 = [];
}

function renderAdmin() {
  document.getElementById("statViews").textContent = localStats.views;
  document.getElementById("statClicks").textContent = localStats.clicks;
  const ctr = localStats.views ? ((localStats.clicks / localStats.views) * 100).toFixed(1) : 0;
  document.getElementById("statCtr").textContent = ctr + "%";
  document.getElementById("statEarnings").textContent = "₹" + ((storeData.earnings && storeData.earnings.amount) || 0);

  document.getElementById("adminProductList").innerHTML = storeData.products.map(function(p) {
    const hasAff = p.affiliateUrl && p.affiliateUrl.trim() !== "";
    return '<div style="display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid rgba(255,255,255,0.06); gap:8px;">' +
      '<div>' +
        '<div style="font-weight:600; font-size:0.9rem;">' + p.name + '</div>' +
        '<div style="font-size:0.78rem; color:var(--muted);">₹' + p.price + ' • ' + p.category + ' • ' + (p.published ? "Live" : "Draft") + '</div>' +
        '<span class="pill-tag ' + (hasAff ? 'tag-aff' : 'tag-norm') + '">' + (hasAff ? 'Affiliate Link Active' : 'Normal Link Only') + '</span>' +
      '</div>' +
      '<div style="display:flex; gap:6px;">' +
        '<button class="icon-btn" onclick="editProduct(\'' + p.id + '\')">Edit</button>' +
        '<button class="icon-btn" style="color:var(--danger);" onclick="deleteProduct(\'' + p.id + '\')">Del</button>' +
      '</div>' +
    '</div>';
  }).join("");
}

async function pushToGitHub() {
  const token = localStorage.getItem("dv_gh_token");
  if (!token) return alert("Connect your GitHub token first.");
  const status = document.getElementById("syncStatus");
  status.textContent = "⏳ Saving to GitHub...";

  try {
    const api = "https://api.github.com/repos/" + REPO_OWNER + "/" + REPO_NAME + "/contents/" + DATA_FILE;
    let sha = null;
    const getRes = await fetch(api, { headers: { Authorization: "token " + token } });
    if (getRes.ok) {
      const info = await getRes.json();
      sha = info.sha;
    }

    const content = btoa(unescape(encodeURIComponent(JSON.stringify(storeData, null, 2))));
    const bodyObj = {
      message: "Update Drex Vex Store catalog",
      content: content
    };
    if (sha) bodyObj.sha = sha;

    const putRes = await fetch(api, {
      method: "PUT",
      headers: { Authorization: "token " + token, "Content-Type": "application/json" },
      body: JSON.stringify(bodyObj)
    });

    if (!putRes.ok) throw new Error("Token rejected or invalid permissions.");
    status.textContent = "✅ Saved! Live store will refresh in ~30 seconds.";
    renderCategories();
    renderProducts();
    renderAdmin();
  } catch (err) {
    status.textContent = "❌ Error: " + err.message;
  }
}

init();
</script>
</body>
</html>
